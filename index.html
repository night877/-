<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Пищевой Дневник</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #7289da;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #333333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 40px;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            text-align: center;
        }
        h2 {
            font-size: 1.2rem;
            margin: 20px 0 10px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin: 5px 0;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        button.secondary {
            background: #444;
        }
        button.danger {
            background: #d9534f;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 1rem;
            margin: 5px 0;
        }
        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: block;
            margin-top: 8px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: var(--surface);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        .food-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .food-item:last-child {
            border-bottom: none;
        }
        .food-name {
            font-weight: 500;
        }
        .food-details {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .totals {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .hidden {
            display: none;
        }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            min-width: 70px;
            background: #444;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tab.active {
            background: var(--primary);
        }
        .search-box {
            margin: 10px 0;
        }
        .result-item {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            margin: 5px 0;
            cursor: pointer;
        }
        .result-item:active {
            background: #3a3a3a;
        }
        .small {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .weight-input {
            display: inline-block;
            width: 70px;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥗 Мой дневник питания</h1>

        <!-- Основные вкладки -->
        <div class="tabs">
            <button class="tab active" data-tab="diary">Дневник</button>
            <button class="tab" data-tab="add">➕ Добавить</button>
            <button class="tab" data-tab="recipes">Блюда</button>
            <button class="tab" data-tab="custom">Свой продукт</button>
        </div>

        <!-- ДНЕВНИК -->
        <div id="tab-diary">
            <div class="card">
                <h2>Сегодня</h2>
                <div id="diary-list"></div>
                <div class="totals" id="totals"></div>
                <button onclick="clearDiary()" class="danger">Очистить дневник</button>
            </div>
        </div>

        <!-- ДОБАВЛЕНИЕ ЕДЫ -->
        <div id="tab-add" class="hidden">
            <div class="card">
                <h2>Выберите приём пищи</h2>
                <select id="meal-type">
                    <option value="завтрак">Завтрак</option>
                    <option value="обед">Обед</option>
                    <option value="ужин">Ужин</option>
                    <option value="перекус">Перекус</option>
                </select>
                <h2>Поиск продукта</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Начните вводить название..." oninput="searchFood()">
                </div>
                <div id="search-results"></div>
            </div>
        </div>

        <!-- БЛЮДА (РЕЦЕПТЫ) -->
        <div id="tab-recipes" class="hidden">
            <div class="card">
                <h2>Мои блюда</h2>
                <div id="recipe-list"></div>
                <button onclick="showCreateRecipe()">➕ Создать новое блюдо</button>
            </div>
            <!-- Форма создания блюда -->
            <div id="recipe-form" class="card hidden">
                <h2>Новое блюдо</h2>
                <label>Название блюда</label>
                <input type="text" id="recipe-name" placeholder="Например, Борщ">
                <label>Ингредиенты</label>
                <div id="recipe-ingredients"></div>
                <button class="secondary" onclick="addIngredientRow()">➕ Добавить ингредиент</button>
                <label>Количество порций (необязательно)</label>
                <input type="number" id="recipe-servings" placeholder="1" value="1" min="1">
                <button onclick="saveRecipe()">Сохранить блюдо</button>
                <button class="secondary" onclick="hideCreateRecipe()">Отмена</button>
            </div>
        </div>

        <!-- СВОЙ ПРОДУКТ -->
        <div id="tab-custom" class="hidden">
            <div class="card">
                <h2>Добавить свой продукт</h2>
                <label>Название</label>
                <input type="text" id="custom-name" placeholder="Например, Иваси">
                <label>Калории (ккал на 100г)</label>
                <input type="number" id="custom-kcal" placeholder="0">
                <label>Белки (г на 100г)</label>
                <input type="number" id="custom-protein" placeholder="0" step="0.1">
                <label>Жиры (г на 100г)</label>
                <input type="number" id="custom-fat" placeholder="0" step="0.1">
                <label>Углеводы (г на 100г)</label>
                <input type="number" id="custom-carbs" placeholder="0" step="0.1">
                <button onclick="saveCustomProduct()">Сохранить</button>
            </div>
            <div class="card">
                <h3>Мои продукты</h3>
                <div id="custom-products-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ========== БАЗА ПРОДУКТОВ ==========
        // Продукты: название, калории, белки, жиры, углеводы на 100г
        const baseProducts = [
            { name: "Куриная грудка (сырая)", kcal: 113, protein: 23.6, fat: 1.9, carbs: 0.4 },
            { name: "Куриное бедро (сырое)", kcal: 185, protein: 18.2, fat: 12.3, carbs: 0.1 },
            { name: "Индейка (филе)", kcal: 112, protein: 23.5, fat: 1.5, carbs: 0.7 },
            { name: "Говядина (вырезка)", kcal: 187, protein: 18.9, fat: 12.4, carbs: 0 },
            { name: "Свинина (вырезка)", kcal: 242, protein: 15.4, fat: 19.8, carbs: 0 },
            { name: "Яйцо куриное (1 шт, ~50г)", kcal: 70, protein: 6.3, fat: 5, carbs: 0.7 },
            { name: "Творог 5%", kcal: 121, protein: 17.2, fat: 5, carbs: 1.8 },
            { name: "Творог обезжиренный", kcal: 71, protein: 16.5, fat: 0.3, carbs: 1.3 },
            { name: "Греческий йогурт", kcal: 59, protein: 10, fat: 0.4, carbs: 3.6 },
            { name: "Кефир 1%", kcal: 40, protein: 3, fat: 1, carbs: 4 },
            { name: "Молоко 2.5%", kcal: 54, protein: 2.9, fat: 2.5, carbs: 4.8 },
            { name: "Сыр твердый (Российский)", kcal: 364, protein: 23.2, fat: 29.5, carbs: 0 },
            { name: "Сметана 15%", kcal: 162, protein: 2.6, fat: 15, carbs: 3.6 },
            { name: "Масло сливочное 82%", kcal: 748, protein: 0.5, fat: 82.5, carbs: 0.8 },
            { name: "Масло растительное", kcal: 899, protein: 0, fat: 99.9, carbs: 0 },
            { name: "Гречка (сухая)", kcal: 313, protein: 12.6, fat: 3.3, carbs: 62.1 },
            { name: "Рис белый (сухой)", kcal: 344, protein: 6.7, fat: 0.7, carbs: 78.9 },
            { name: "Овсянка (сухая)", kcal: 342, protein: 12.3, fat: 6.1, carbs: 59.5 },
            { name: "Макароны (сухие)", kcal: 350, protein: 10.4, fat: 1.1, carbs: 71.5 },
            { name: "Картофель", kcal: 77, protein: 2, fat: 0.4, carbs: 16.3 },
            { name: "Морковь", kcal: 35, protein: 1.3, fat: 0.1, carbs: 6.9 },
            { name: "Лук репчатый", kcal: 41, protein: 1.4, fat: 0.2, carbs: 8.2 },
            { name: "Капуста белокочанная", kcal: 28, protein: 1.8, fat: 0.2, carbs: 4.7 },
            { name: "Свекла", kcal: 43, protein: 1.5, fat: 0.1, carbs: 8.8 },
            { name: "Помидоры", kcal: 24, protein: 1.1, fat: 0.2, carbs: 3.8 },
            { name: "Огурцы", kcal: 15, protein: 0.8, fat: 0.1, carbs: 2.8 },
            { name: "Перец болгарский", kcal: 27, protein: 1.3, fat: 0.3, carbs: 5.3 },
            { name: "Кабачок", kcal: 24, protein: 1.2, fat: 0.3, carbs: 4.6 },
            { name: "Баклажан", kcal: 24, protein: 1.2, fat: 0.1, carbs: 4.5 },
            { name: "Чеснок", kcal: 149, protein: 6.5, fat: 0.5, carbs: 29.9 },
            { name: "Зелень (укроп, петрушка)", kcal: 40, protein: 2.5, fat: 0.5, carbs: 6.3 },
            { name: "Яблоко", kcal: 52, protein: 0.3, fat: 0.2, carbs: 13.8 },
            { name: "Банан", kcal: 89, protein: 1.1, fat: 0.3, carbs: 22.8 },
            { name: "Апельсин", kcal: 43, protein: 0.9, fat: 0.2, carbs: 8.1 },
            { name: "Груша", kcal: 57, protein: 0.4, fat: 0.3, carbs: 15.2 },
            { name: "Виноград", kcal: 69, protein: 0.7, fat: 0.2, carbs: 17.1 },
            { name: "Клубника", kcal: 41, protein: 0.8, fat: 0.4, carbs: 7.5 },
            { name: "Малина", kcal: 46, protein: 0.8, fat: 0.5, carbs: 8.3 },
            { name: "Черника", kcal: 44, protein: 1.1, fat: 0.6, carbs: 7.6 },
            { name: "Лимон", kcal: 34, protein: 0.9, fat: 0.1, carbs: 3 },
            { name: "Грибы шампиньоны", kcal: 27, protein: 4.3, fat: 1, carbs: 1 },
            { name: "Фасоль (сухая)", kcal: 298, protein: 21, fat: 1.5, carbs: 47 },
            { name: "Чечевица (сухая)", kcal: 295, protein: 24.6, fat: 1.1, carbs: 46.3 },
            { name: "Горох (сухой)", kcal: 298, protein: 20.5, fat: 2, carbs: 49.5 },
            { name: "Нут (сухой)", kcal: 309, protein: 20.1, fat: 4.3, carbs: 46.2 },
            { name: "Миндаль", kcal: 609, protein: 18.6, fat: 53.7, carbs: 13 },
            { name: "Грецкий орех", kcal: 654, protein: 15.2, fat: 65.2, carbs: 7 },
            { name: "Арахис", kcal: 552, protein: 26.3, fat: 45.2, carbs: 9.9 },
            { name: "Семена подсолнечника", kcal: 601, protein: 20.7, fat: 52.9, carbs: 10.5 },
            { name: "Лосось (сырой)", kcal: 208, protein: 20, fat: 13, carbs: 0 },
            { name: "Тунец (консерва в масле)", kcal: 198, protein: 24, fat: 11, carbs: 0 },
            { name: "Сардина (консерва)", kcal: 208, protein: 24.6, fat: 11.5, carbs: 0 },
            { name: "Скумбрия", kcal: 262, protein: 18, fat: 21, carbs: 0 },
            { name: "Креветки", kcal: 98, protein: 20.5, fat: 1.7, carbs: 0.9 },
            { name: "Кальмар", kcal: 100, protein: 18, fat: 2.2, carbs: 2 },
            { name: "Иваси (консерва)", kcal: 250, protein: 17, fat: 20, carbs: 0 },
        ];

        // Пользовательские продукты (хранятся в localStorage)
        let customProducts = JSON.parse(localStorage.getItem('customProducts') || '[]');

        // Рецепты (хранятся в localStorage)
        let recipes = JSON.parse(localStorage.getItem('recipes') || '[]');

        // Дневник (хранится в localStorage)
        let diary = JSON.parse(localStorage.getItem('diary') || '[]');

        // Текущий выбранный приём пищи
        let currentMealType = 'завтрак';

        // Вспомогательная функция для поиска
        function searchFood() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';

            if (!query) {
                resultsDiv.innerHTML = '<div class="small">Введите название продукта...</div>';
                return;
            }

            const allProducts = [...baseProducts, ...customProducts];
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query)).slice(0, 20);

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="small">Ничего не найдено</div>';
                return;
            }

            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="food-name">${p.name}</div>
                    <div class="small">${p.kcal} ккал | Б:${p.protein} Ж:${p.fat} У:${p.carbs} (на 100г)</div>
                `;
                div.onclick = () => addFoodToDiary(p);
                resultsDiv.appendChild(div);
            });
        }

        function addFoodToDiary(product) {
            const weight = prompt(`Введите вес (граммы) для "${product.name}"`, '100');
            if (!weight || isNaN(weight) || weight <= 0) return;
            const grams = parseFloat(weight);
            const factor = grams / 100;
            const entry = {
                id: Date.now(),
                name: product.name,
                grams: grams,
                kcal: Math.round(product.kcal * factor * 10) / 10,
                protein: Math.round(product.protein * factor * 10) / 10,
                fat: Math.round(product.fat * factor * 10) / 10,
                carbs: Math.round(product.carbs * factor * 10) / 10,
                meal: currentMealType,
                date: new Date().toISOString().slice(0,10) // YYYY-MM-DD
            };
            diary.push(entry);
            saveDiary();
            renderDiary();
            // Переключаем на дневник
            switchTab('diary');
            document.getElementById('search-input').value = '';
            document.getElementById('search-results').innerHTML = '';
        }

        function saveDiary() {
            localStorage.setItem('diary', JSON.stringify(diary));
        }

        function renderDiary() {
            const listDiv = document.getElementById('diary-list');
            const totalsDiv = document.getElementById('totals');
            const today = new Date().toISOString().slice(0,10);

            const todayEntries = diary.filter(e => e.date === today);

            if (todayEntries.length === 0) {
                listDiv.innerHTML = '<div class="small">Сегодня ещё ничего не добавлено</div>';
                totalsDiv.textContent = 'Итого: 0 ккал';
                return;
            }

            let totalKcal = 0, totalProtein = 0, totalFat = 0, totalCarbs = 0;
            let html = '';
            const meals = ['завтрак', 'обед', 'ужин', 'перекус'];
            meals.forEach(meal => {
                const mealEntries = todayEntries.filter(e => e.meal === meal);
                if (mealEntries.length > 0) {
                    html += `<div style="margin-top:10px;"><strong>${meal.charAt(0).toUpperCase() + meal.slice(1)}</strong></div>`;
                    mealEntries.forEach(entry => {
                        html += `
                            <div class="food-item">
                                <div>
                                    <div class="food-name">${entry.name}</div>
                                    <div class="food-details">${entry.grams} г</div>
                                </div>
                                <div style="text-align:right">
                                    <div>${entry.kcal} ккал</div>
                                    <div class="small">Б:${entry.protein} Ж:${entry.fat} У:${entry.carbs}</div>
                                </div>
                            </div>
                        `;
                    });
                }
            });

            todayEntries.forEach(e => {
                totalKcal += e.kcal;
                totalProtein += e.protein;
                totalFat += e.fat;
                totalCarbs += e.carbs;
            });

            listDiv.innerHTML = html;
            totalsDiv.textContent = `Итого: ${Math.round(totalKcal)} ккал | Б:${Math.round(totalProtein)}г Ж:${Math.round(totalFat)}г У:${Math.round(totalCarbs)}г`;
        }

        function clearDiary() {
            if (confirm('Очистить дневник за сегодня?')) {
                const today = new Date().toISOString().slice(0,10);
                diary = diary.filter(e => e.date !== today);
                saveDiary();
                renderDiary();
            }
        }

        // ========== РЕЦЕПТЫ ==========
        function showCreateRecipe() {
            document.getElementById('recipe-form').classList.remove('hidden');
            document.getElementById('recipe-ingredients').innerHTML = '';
            addIngredientRow(); // одна строка по умолчанию
        }

        function hideCreateRecipe() {
            document.getElementById('recipe-form').classList.add('hidden');
        }

        function addIngredientRow() {
            const container = document.getElementById('recipe-ingredients');
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.gap = '5px';
            row.style.marginBottom = '5px';
            row.innerHTML = `
                <select class="ingredient-select" style="flex:2;">
                    <option value="">Выберите продукт</option>
                    ${getAllProductsOptions()}
                </select>
                <input type="number" class="ingredient-weight" placeholder="Вес, г" style="flex:1;" min="1">
                <button type="button" class="secondary" style="width:30px; flex:0;" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(row);
        }

        function getAllProductsOptions() {
            const all = [...baseProducts, ...customProducts];
            return all.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
        }

        function saveRecipe() {
            const name = document.getElementById('recipe-name').value.trim();
            if (!name) {
                alert('Введите название блюда');
                return;
            }

            const ingredientRows = document.querySelectorAll('#recipe-ingredients > div');
            const ingredients = [];
            let totalWeight = 0;

            ingredientRows.forEach(row => {
                const select = row.querySelector('.ingredient-select');
                const weightInput = row.querySelector('.ingredient-weight');
                const productName = select.value;
                const weight = parseFloat(weightInput.value);
                if (productName && weight > 0) {
                    const product = [...baseProducts, ...customProducts].find(p => p.name === productName);
                    if (product) {
                        ingredients.push({
                            name: product.name,
                            grams: weight,
                            kcal: product.kcal * weight / 100,
                            protein: product.protein * weight / 100,
                            fat: product.fat * weight / 100,
                            carbs: product.carbs * weight / 100
                        });
                        totalWeight += weight;
                    }
                }
            });

            if (ingredients.length === 0) {
                alert('Добавьте хотя бы один ингредиент с весом');
                return;
            }

            const servings = parseInt(document.getElementById('recipe-servings').value) || 1;
            const totalKcal = ingredients.reduce((sum, ing) => sum + ing.kcal, 0);
            const totalProtein = ingredients.reduce((sum, ing) => sum + ing.protein, 0);
            const totalFat = ingredients.reduce((sum, ing) => sum + ing.fat, 0);
            const totalCarbs = ingredients.reduce((sum, ing) => sum + ing.carbs, 0);

            const recipe = {
                id: Date.now(),
                name: name,
                ingredients: ingredients,
                totalWeight: totalWeight,
                servings: servings,
                kcalPer100: totalWeight > 0 ? totalKcal / totalWeight * 100 : 0,
                proteinPer100: totalWeight > 0 ? totalProtein / totalWeight * 100 : 0,
                fatPer100: totalWeight > 0 ? totalFat / totalWeight * 100 : 0,
                carbsPer100: totalWeight > 0 ? totalCarbs / totalWeight * 100 : 0,
                totalKcal: totalKcal,
                totalProtein: totalProtein,
                totalFat: totalFat,
                totalCarbs: totalCarbs
            };

            recipes.push(recipe);
            localStorage.setItem('recipes', JSON.stringify(recipes));
            hideCreateRecipe();
            document.getElementById('recipe-name').value = '';
            document.getElementById('recipe-servings').value = '1';
            renderRecipeList();
        }

        function renderRecipeList() {
            const listDiv = document.getElementById('recipe-list');
            if (recipes.length === 0) {
                listDiv.innerHTML = '<div class="small">У вас пока нет сохранённых блюд</div>';
                return;
            }

            let html = '';
            recipes.forEach(r => {
                html += `
                    <div class="food-item">
                        <div>
                            <div class="food-name">${r.name}</div>
                            <div class="small">${r.servings} порц. | ${r.totalWeight}г | ${Math.round(r.kcalPer100)} ккал/100г</div>
                            <div class="small">Б:${Math.round(r.proteinPer100)} Ж:${Math.round(r.fatPer100)} У:${Math.round(r.carbsPer100)}</div>
                        </div>
                        <button class="secondary" style="width:auto; padding:5px 10px;" onclick="addRecipeToDiary('${r.id}')">➕</button>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        function addRecipeToDiary(recipeId) {
            const recipe = recipes.find(r => r.id == recipeId);
            if (!recipe) return;

            const weight = prompt(`Введите вес порции (в граммах) для "${recipe.name}"`, '300');
            if (!weight || isNaN(weight) || weight <= 0) return;
            const grams = parseFloat(weight);
            const factor = grams / 100;
            const entry = {
                id: Date.now(),
                name: recipe.name,
                grams: grams,
                kcal: Math.round(recipe.kcalPer100 * factor * 10) / 10,
                protein: Math.round(recipe.proteinPer100 * factor * 10) / 10,
                fat: Math.round(recipe.fatPer100 * factor * 10) / 10,
                carbs: Math.round(recipe.carbsPer100 * factor * 10) / 10,
                meal: currentMealType,
                date: new Date().toISOString().slice(0,10)
            };
            diary.push(entry);
            saveDiary();
            renderDiary();
            switchTab('diary');
        }

        // ========== СВОИ ПРОДУКТЫ ==========
        function saveCustomProduct() {
            const name = document.getElementById('custom-name').value.trim();
            const kcal = parseFloat(document.getElementById('custom-kcal').value);
            const protein = parseFloat(document.getElementById('custom-protein').value) || 0;
            const fat = parseFloat(document.getElementById('custom-fat').value) || 0;
            const carbs = parseFloat(document.getElementById('custom-carbs').value) || 0;

            if (!name || isNaN(kcal)) {
                alert('Введите название и калорийность');
                return;
            }

            const newProduct = { name, kcal, protein, fat, carbs };
            customProducts.push(newProduct);
            localStorage.setItem('customProducts', JSON.stringify(customProducts));
            document.getElementById('custom-name').value = '';
            document.getElementById('custom-kcal').value = '';
            document.getElementById('custom-protein').value = '';
            document.getElementById('custom-fat').value = '';
            document.getElementById('custom-carbs').value = '';
            renderCustomProducts();
        }

        function renderCustomProducts() {
            const listDiv = document.getElementById('custom-products-list');
            if (customProducts.length === 0) {
                listDiv.innerHTML = '<div class="small">Нет добавленных продуктов</div>';
                return;
            }
            let html = '';
            customProducts.forEach(p => {
                html += `
                    <div class="food-item">
                        <div>
                            <div class="food-name">${p.name}</div>
                            <div class="small">${p.kcal} ккал | Б:${p.protein} Ж:${p.fat} У:${p.carbs}</div>
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;
        }

        // ========== НАВИГАЦИЯ ==========
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tabName);
            });
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            if (tabName === 'diary') renderDiary();
            if (tabName === 'recipes') renderRecipeList();
            if (tabName === 'custom') renderCustomProducts();
            if (tabName === 'add') {
                document.getElementById('search-input').focus();
            }
        }

        // Обработчики вкладок
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Приём пищи по умолчанию
        document.getElementById('meal-type').addEventListener('change', function() {
            currentMealType = this.value;
        });

        // Загружаем дневник и продукты при старте
        renderDiary();
        renderCustomProducts();
        renderRecipeList();

        console.log('Приложение запущено');
    </script>
</body>
</html>
